            zoomSnap: 0.1,
            attributionControl: false,
            renderer: L.svg({ padding: 2.5 })   // ou L.canvas({ padding: 1 })
        });

        // Définition des limites de l'image
        const bounds = [[0, 0], [imageHeight, imageWidth]];

        // Affichage de l'image entière
        const image = L.imageOverlay('Cuphead_map.png', bounds).addTo(map);

        // Ajustement automatique à l'image
        map.fitBounds(bounds);

        // Empêche de trop s'éloigner de l'image
        map.setMaxBounds(bounds);
        
        const marker = L.marker([imageHeight-2288, 694]).addTo(map);
        marker.bindPopup("<b>Hello !</b><br>Welcome to the Inkwell's Islands !", {closeButton: false});

        // Ouvrir la popup au survol
        marker.on('mouseover', function () { this.openPopup(); });

        // Fermer la popup lorsque la souris quitte le marker
        marker.on('mouseout', function () { this.closePopup(); });
