        marker.on('mouseover', function () { this.openPopup(); });

        // Fermer la popup lorsque la souris quitte le marker
        marker.on('mouseout', function () { this.closePopup(); });

        const popup = L.popup();
        function onMapClick(e) {
            // Conversion des coordonnées Leaflet en pixels
            const pixelX = Math.round(e.latlng.lng);
            const pixelY = Math.round(imageHeight - e.latlng.lat);
            popup
                .setLatLng(e.latlng)
                .setContent(
                    "Coordonnées de l'image :<br>" +

                    "Y : " + pixelY + " px"
