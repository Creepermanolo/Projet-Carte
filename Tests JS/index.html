        //#region Set up map
        
        // Dimensions de l'image
        const imageWidth = 5830;
        const imageHeight = 2868;

        // Initialisation de la carte en coordonnées pixels
        const map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -2,
            maxZoom: 2,
            zoomSnap: 0.1,
            attributionControl: false,
            renderer: L.svg({ padding: 2.5 })   // ou L.canvas({ padding: 1 })
        });

        const bounds = [[0, 0], [imageHeight, imageWidth]]; // Limites de l'image
        const image = L.imageOverlay('Cuphead_map.png', bounds).addTo(map); // Affichage de l'image entière
        map.fitBounds(bounds); // Ajustement automatique à l'image
        map.setMaxBounds(bounds); // Empêche de trop s'éloigner de l'image
        
        //#endregion

        //#region Test marker

        const marker = L.marker([imageHeight - 2288, 694]).addTo(map);
        const popup = L.popup({ closeButton: false }).setContent("<b>Hello !</b><br>Welcome to the Inkwell's Islands !");
        marker.bindPopup(popup);

        let clicked = false;

        marker.on('mouseover', function () {
            if (!clicked) this.openPopup();
        });

        marker.on('mouseout', function () {
            if (!clicked) this.closePopup();
        });

        marker.on('click', function () {
            clicked = !clicked;
            if (clicked) this.openPopup();
            else this.closePopup();
        })

        marker.on('popupclose', function() {
            clicked = false;
        })

        //#endregion

        //#region Coordonnées en temps réel

        const coordinates = document.getElementById("coordinates");

        map.on("mousemove", (e) => {
            const lat = e.latlng.lat.toFixed(0);
            const lng = e.latlng.lng.toFixed();
            coordinates.textContent = `Lat/Y : ${lat} | Lng/X : ${lng}`;
        });

        map.on("mouseout", () => {
            coordinates.textContent = "Lat/Y : -- | Lng/X : --";
        });

        //#endregion

        //#region Set up overlay SVG

        const svgNS = "http://www.w3.org/2000/svg";
        const svg = document.createElementNS(svgNS, "svg");
        svg.setAttribute("viewBox", `0 0 ${imageWidth} ${imageHeight}`);
        svg.setAttribute("preserveAspectRatio", "none");
        L.svgOverlay(svg, bounds, { interactive: false }).addTo(map);

        //#region Set up Masques zones

        function setMask(name, points) {
            name.setAttribute("points", points.map(([x, y]) => `${x},${y}`).join(" "));
            name.setAttribute("fill", "#545454");
            name.setAttribute("stroke", "#3d3d3d");
            name.setAttribute("stroke-width", "2");
            name.setAttribute("stroke-linejoin", "round"); // Angles arrondis
            name.setAttribute("stroke-linecap", "round"); // Extrémités arrondies
            name.setAttribute("vector-effect", "non-scaling-stroke"); // épaisseur constante au zoom
            name.style.pointerEvents = "auto";                        // rend la forme cliquable
            svg.appendChild(name);
        }

        const isle2Mask = document.createElementNS(svgNS, "polygon");
        setMask(isle2Mask, isle2Points);

        const isle3Mask = document.createElementNS(svgNS, "polygon");
        setMask(isle3Mask, isle3Points);

        const hellMask = document.createElementNS(svgNS, "polygon");
        setMask(hellMask, hellPoints);

        const dlcMask = document.createElementNS(svgNS, "polygon");
        setMask(dlcMask, dlcPoints);

        //#endregion

        //#region Set up Interactions hellMask + Test tooltip

        const tooltip = L.tooltip({ sticky: true, direction: 'top', offset: [0, -10] });

        hellMask.addEventListener("click", (e) => {
            e.stopPropagation()
            tooltip.removeFrom(map);
            L.popup({ closeButton: false })
                .setLatLng(map.mouseEventToLatLng(e))
                .setContent("Souhaitez-vous découvrir la zone \"Enfer\" ?")
                .openOn(map);
        });

        hellMask.addEventListener("mouseover", (e) => {
            if (map.hasLayer(tooltip)) return;
            if (map._popup && map._popup.isOpen()) return;
            tooltip.setLatLng(map.mouseEventToLatLng(e))
            tooltip.setContent('Hello world!<br />This is a nice tooltip.')
            tooltip.addTo(map);
        });

        hellMask.addEventListener("mousemove", (e) => {
            if (map.hasLayer(tooltip)) {
                tooltip.setLatLng(map.mouseEventToLatLng(e));
            }
        });

        hellMask.addEventListener("mouseout", (e) => {
            tooltip.removeFrom(map);
        });

        //#endregion
